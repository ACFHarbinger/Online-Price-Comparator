<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        width: 240px;
        padding: 12px;
        margin: 0;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { margin: 6px 0; color: #555; }
      button {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      #status { min-height: 1em; margin-top: 8px; font-size: 12px; color: #1a73e8; }
    </style>
  </head>
  <body>
    <h1>OPC Leboncoin monitor</h1>
    <p>Exports accumulated detected price changes as a JSON-lines file, to import with
       <code>cli refresh --import-extension-file</code>.</p>
    <button id="export">Export detected changes</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
